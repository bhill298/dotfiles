personality = "pragmatic"
model_reasoning_summary = "detailed"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = true

[windows]
sandbox = "elevated"

[features]
memories = false

[analytics]
enabled = false

[tui]
vim_mode_default = false
pet = "custom:Pancake"
status_line = ["model-with-reasoning", "current-dir", "git-branch", "weekly-limit", "context-window-size", "context-used", "fast-mode"]

[otel]
exporter = "none"
metrics_exporter = "none"
log_user_prompt = false
trace_exporter = "none"
